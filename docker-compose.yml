version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodmatch_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodmatch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodmatch_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-foodmatch_db}
    ports:
      - "5432:5432"
    volumes:
      - foodmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodmatch_admin} -d ${POSTGRES_DB:-foodmatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  foodmatch_pgdata:
    driver: local
